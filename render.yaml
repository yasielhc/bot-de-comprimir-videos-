services:
  - type: worker
    name: telegram-video-compressor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_VIDEO_SIZE_MB
        value: "2000"
      - key: MAX_PROCESSING_TIME_SECONDS
        value: "1800"
      - key: TEMP_DIR
        value: /tmp/downloads
      - key: OUTPUT_DIR
        value: /tmp/compressed
